name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: areamatrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/.build/cargo/validation
  RUSTFLAGS: "-D warnings"

jobs:
  prompt-doctor:
    name: prompt doctor
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ./dev check prompts

  fmt:
    name: cargo fmt
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0, reviewed 2026-08-21
        with:
          components: rustfmt
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - run: cargo fmt --all -- --check
        working-directory: core

  clippy:
    name: cargo clippy
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0, reviewed 2026-08-21
        with:
          components: clippy
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: core
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: core

  test:
    name: cargo test
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0, reviewed 2026-08-21
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: core
      - run: cargo test --locked --all-features --workspace
        working-directory: core

  build-universal:
    name: build universal binary and bindings
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0, reviewed 2026-08-21
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: core
      - name: Build core
        run: ./dev build core

  coverage:
    name: coverage gate
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0, reviewed 2026-08-21
        with:
          components: llvm-tools-preview
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: core
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Run coverage
        working-directory: core
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info --fail-under-lines 70
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: core/lcov.info
