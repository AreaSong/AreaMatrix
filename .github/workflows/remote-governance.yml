name: Remote Governance Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: areamatrix-remote-governance
  cancel-in-progress: true

jobs:
  audit:
    name: remote governance audit
    runs-on: ubuntu-24.04
    env:
      EXPECTED_REPOSITORY: AreaSong/AreaMatrix
      EXPECTED_REF: refs/heads/main
      AUDIT_BRANCH: main
    steps:
      - name: Verify trusted main invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-inside-work-tree)" = true
          test -n "$(git rev-parse HEAD)"

      - name: Run read-only remote governance audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./dev governance remote-audit \
            --branch "$AUDIT_BRANCH" \
            --recent-runs 30 \
            --json | tee remote-governance.json

      - name: Upload remote governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-governance-evidence
          path: remote-governance.json
          if-no-files-found: error
          retention-days: 30
