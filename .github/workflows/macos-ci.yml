name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: areamatrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompt-doctor:
    name: prompt doctor
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./dev check prompts

  core-sdk:
    name: Build reusable CoreSDK
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: core-sdk

      - name: Build CoreSDK once
        run: ./dev build core-sdk

      - name: Verify tracked Swift bindings
        run: ./dev bindings verify

      - name: Verify generated Swift package
        run: swift build --package-path .build/core-sdk/current

      - name: Package CoreSDK cache entry
        run: tar -czf core-sdk.tar.gz -C .build core-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: core-sdk
          path: core-sdk.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Xcode build-for-testing & layered tests
    runs-on: macos-14
    needs: [prompt-doctor, core-sdk]
    env:
      AREAMATRIX_CORE_SDK_VERIFY_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS project
        run: test -d apps/macos/AreaMatrix.xcodeproj

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: core-sdk
          path: .build/artifacts

      - name: Restore reusable CoreSDK
        run: |
          tar -xzf .build/artifacts/core-sdk.tar.gz -C .build
          ./dev build core-sdk --verify-only

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/macos/AreaMatrix.xcodeproj \
            -scheme AreaMatrix

      - name: Build XCTest products once
        run: >-
          ./dev test macos --build-for-testing
          --derived-data-path .build/derived-data/macos-ci
          --enable-code-coverage
          --build-log .build/derived-data/macos-ci/xcodebuild-build-for-testing.log

      - name: Upload Xcode build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcode-build-diagnostics
          path: .build/derived-data/macos-ci/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run Unit test plan without rebuilding
        run: >-
          ./dev test macos --test-without-building --test-plan AreaMatrix-Unit
          --derived-data-path .build/derived-data/macos-ci
          --test-log .build/derived-data/macos-ci/xcodebuild-unit.log
          --disable-parallel-testing

      - name: Run Feature test plan without rebuilding
        run: >-
          ./dev test macos --test-without-building --test-plan AreaMatrix-Feature
          --derived-data-path .build/derived-data/macos-ci
          --test-log .build/derived-data/macos-ci/xcodebuild-feature.log
          --disable-parallel-testing

      - name: Run Integration test plan without rebuilding
        run: >-
          ./dev test macos --test-without-building --test-plan AreaMatrix-Integration
          --derived-data-path .build/derived-data/macos-ci
          --test-log .build/derived-data/macos-ci/xcodebuild-integration.log
          --disable-parallel-testing

      - name: Run Functional coverage plan without rebuilding
        run: >-
          ./dev test macos --test-without-building --test-plan AreaMatrix-Functional
          --derived-data-path .build/derived-data/macos-ci
          --test-log .build/derived-data/macos-ci/xcodebuild-functional.log
          --result-bundle-path TestResults.xcresult
          --disable-parallel-testing --coverage-gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult
          path: TestResults.xcresult

  ios-package:
    name: iOS Swift package build & test
    runs-on: macos-14
    needs: [prompt-doctor, core-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Require iOS package
        run: test -f apps/ios/Package.swift

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: core-sdk
          path: .build/artifacts

      - name: Restore and verify reusable CoreSDK
        run: |
          tar -xzf .build/artifacts/core-sdk.tar.gz -C .build
          ./dev build core-sdk --verify-only

      - name: Link verified CoreSDK into the iOS package
        run: ln -s ../../.build/core-sdk/current apps/ios/.core-sdk

      - name: Build iOS Swift package
        run: swift build --package-path apps/ios

      - name: Test iOS Swift package
        run: swift test --package-path apps/ios

  swiftlint:
    name: SwiftLint
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@v4
      - name: Require macOS sources
        run: test -d apps/macos/AreaMatrix
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --config ../../scripts/dev_tools/swiftlint.yml --force-exclude . --no-cache
        working-directory: apps/macos

  swiftformat:
    name: SwiftFormat lint
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@v4
      - name: Require macOS sources
        run: test -d apps/macos/AreaMatrix
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat (check)
        run: swiftformat --lint . --config ../../scripts/dev_tools/swiftformat.conf --exclude AreaMatrix/Bridge/Generated,AreaMatrix/Bridge/UniFFI,DerivedData --cache ignore
        working-directory: apps/macos
