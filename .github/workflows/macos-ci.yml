name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prompt-doctor:
    name: prompt doctor
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./dev check prompts

  build:
    name: Xcode build & test
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS project
        run: test -d apps/macos/AreaMatrix.xcodeproj

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build core (Rust → universal staticlib + Swift bindings)
        run: ./dev build core

      - name: Verify tracked Swift bindings
        run: ./dev bindings verify

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/macos/AreaMatrix.xcodeproj \
            -scheme AreaMatrix

      - name: Build & test
        run: ./dev test macos --destination 'platform=macOS,arch=arm64' --result-bundle-path TestResults.xcresult --disable-parallel-testing --coverage-gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult
          path: TestResults.xcresult

  swiftlint:
    name: SwiftLint
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@v4
      - name: Require macOS sources
        run: test -d apps/macos/AreaMatrix
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --config ../../scripts/dev_tools/swiftlint.yml --force-exclude . --no-cache
        working-directory: apps/macos

  swiftformat:
    name: SwiftFormat lint
    runs-on: macos-14
    needs: prompt-doctor
    steps:
      - uses: actions/checkout@v4
      - name: Require macOS sources
        run: test -d apps/macos/AreaMatrix
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat (check)
        run: swiftformat --lint . --config ../../scripts/dev_tools/swiftformat.conf --exclude AreaMatrix/Bridge/Generated,AreaMatrix/Bridge/UniFFI,DerivedData --cache ignore
        working-directory: apps/macos
