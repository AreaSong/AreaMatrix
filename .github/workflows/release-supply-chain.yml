name: Release Supply-Chain Gate

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release identifier recorded in the SBOM"
        required: true
        type: string
      artifact_url:
        description: "Canonical GitHub Release asset URL for the exact artifact to audit"
        required: true
        type: string
      artifact_filename:
        description: "Safe filename, for example AreaMatrix-v0.1.0.dmg"
        required: true
        type: string
      artifact_sha256:
        description: "Expected lowercase SHA-256 of the exact artifact"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: areamatrix-release-supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ref-gate:
    name: require trusted main ref
    runs-on: ubuntu-24.04
    env:
      EXPECTED_REPOSITORY: AreaSong/AreaMatrix
      EXPECTED_REF: refs/heads/main
    steps:
      - name: Reject non-main invocation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ] || [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "release supply-chain gate must run from AreaSong/AreaMatrix refs/heads/main" >&2
            exit 1
          fi

  materials:
    name: artifact SBOM, notices, source offer, and review gate
    runs-on: ubuntu-24.04
    needs: ref-gate
    environment: release-legal-review
    if: github.ref == 'refs/heads/main'
    env:
      EXPECTED_REPOSITORY: AreaSong/AreaMatrix
      EXPECTED_REF: refs/heads/main
      ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      ARTIFACT_URL: ${{ inputs.artifact_url }}
      RELEASE_ID: ${{ inputs.release }}
    steps:
      - name: Verify trusted main invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"

      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0, reviewed 2026-08-21
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"

      - name: Validate inputs and download exact artifact
        run: |
          set -euo pipefail
          case "$ARTIFACT_FILENAME" in
            ""|*[!A-Za-z0-9._-]*)
              echo "artifact_filename contains unsupported characters" >&2
              exit 2
              ;;
          esac
          case "$RELEASE_ID" in
            ""|*[!A-Za-z0-9._-]*)
              echo "release contains unsupported characters" >&2
              exit 2
              ;;
          esac
          if ! printf '%s' "$ARTIFACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "artifact_sha256 must be 64 lowercase hexadecimal characters" >&2
            exit 2
          fi
          expected_artifact_url="https://github.com/AreaSong/AreaMatrix/releases/download/$RELEASE_ID/$ARTIFACT_FILENAME"
          if [ "$ARTIFACT_URL" != "$expected_artifact_url" ]; then
            echo "artifact_url must exactly match the canonical GitHub Release URL for release and filename" >&2
            exit 2
          fi
          artifact_dir="$RUNNER_TEMP/areamatrix-release-artifact"
          mkdir -p "$artifact_dir"
          max_artifact_bytes=1073741824
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 300 --max-filesize "$max_artifact_bytes" \
            "$ARTIFACT_URL" --output "$artifact_dir/$ARTIFACT_FILENAME"
          test -f "$artifact_dir/$ARTIFACT_FILENAME"
          actual_artifact_bytes="$(stat -c '%s' "$artifact_dir/$ARTIFACT_FILENAME")"
          if [ "$actual_artifact_bytes" -gt "$max_artifact_bytes" ]; then
            echo "downloaded artifact exceeds the temporary operational size cap" >&2
            exit 1
          fi

      - name: Generate artifact-specific supply-chain materials
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 scripts/dev_tools/supply_chain.py generate \
            --artifact-root "$RUNNER_TEMP/areamatrix-release-artifact" \
            --artifact-relative "$ARTIFACT_FILENAME" \
            --expected-artifact-sha256 "$ARTIFACT_SHA256" \
            --release "$RELEASE_ID" \
            --cargo-target aarch64-apple-darwin \
            --cargo-target x86_64-apple-darwin \
            --output-dir "$RUNNER_TEMP/areamatrix-supply-chain"

      - name: Decode external review record
        id: review_record
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          REVIEW_RECORD_B64: ${{ secrets.SUPPLY_CHAIN_REVIEW_RECORD_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$REVIEW_RECORD_B64" ]; then
            echo "SUPPLY_CHAIN_REVIEW_RECORD_B64 is not configured in release-legal-review" >&2
            exit 1
          fi
          review_dir="$RUNNER_TEMP/areamatrix-release-review"
          mkdir -p "$review_dir"
          printf '%s' "$REVIEW_RECORD_B64" | base64 --decode > "$review_dir/review.json"

      - name: Verify material bindings and external review record
        id: verify
        if: steps.generate.outcome == 'success' && steps.review_record.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dev_tools/supply_chain.py verify \
            --bundle-dir "$RUNNER_TEMP/areamatrix-supply-chain" \
            --artifact-root "$RUNNER_TEMP/areamatrix-release-artifact" \
            --artifact-relative "$ARTIFACT_FILENAME" \
            --review-record-root "$RUNNER_TEMP/areamatrix-release-review" \
            --review-record-relative review.json

      - name: Upload generated supply-chain evidence
        if: always() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ inputs.release }}
          path: ${{ runner.temp }}/areamatrix-supply-chain
          if-no-files-found: error
          retention-days: 90

      - name: Keep release blocked until the artifact-specific technical binding succeeds
        if: steps.generate.outcome != 'success' || steps.review_record.outcome != 'success' || steps.verify.outcome != 'success'
        run: |
          echo "Release supply-chain evidence or qualified external review is incomplete." >&2
          exit 1
