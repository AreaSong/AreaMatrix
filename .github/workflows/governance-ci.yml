name: Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    name: governance, prompts, skills, and task-loop
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Governance check
        run: ./dev check governance

      - name: Documentation integrity
        run: ./dev check docs

      - name: Skill health
        run: ./dev check skills

      - name: Quality smoke
        run: ./dev check quality

      - name: Brand asset dependencies
        run: |
          python3 -m venv .brand-venv
          .brand-venv/bin/pip install --requirement scripts/brand/requirements.txt

      - name: Brand asset integrity
        run: .brand-venv/bin/python scripts/brand/validate_assets.py

      - name: Codex OS health
        run: ./dev check codex-os

      - name: Long-term wording audit
        run: ./dev check wording

      - name: Task-loop health
        run: ./dev check task-loop

      - name: Prompt doctor
        run: ./dev check prompts

      - name: Diff whitespace check
        run: ./dev check diff

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
