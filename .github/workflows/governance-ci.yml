name: Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: areamatrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance, prompts, skills, and task-loop
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"

      - name: Governance check
        run: ./dev check governance

      - name: Documentation integrity
        run: ./dev check docs

      - name: Skill health
        run: ./dev check skills

      - name: Quality smoke
        run: ./dev check quality

      - name: Brand asset dependencies
        run: |
          python3 -m venv .brand-venv
          .brand-venv/bin/python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/brand/requirements.txt

      - name: Brand asset integrity
        run: .brand-venv/bin/python scripts/brand/validate_assets.py

      - name: Codex OS health
        run: ./dev check codex-os

      - name: Long-term wording audit
        run: ./dev check wording

      - name: Task-loop health
        run: ./dev check task-loop

      - name: Prompt doctor
        run: ./dev check prompts

      - name: Diff whitespace check
        run: ./dev check diff

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
