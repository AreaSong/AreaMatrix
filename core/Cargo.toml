[package]
name = "area_matrix_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]
resolver = "2"

[lib]
name = "area_matrix_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.28", default-features = false }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "1"
sha2 = "0.10"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[build-dependencies]
uniffi = { version = "0.28", default-features = false, features = ["build"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
