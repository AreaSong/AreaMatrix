raid:
  - id: AM-RISK-001
    type: risk
    status: open
    severity: high
    probability: high
    impact: high
    impact_scope: independent-review-and-L3-L4-governance-gates
    owner: "@AreaSong"
    summary: Single-maintainer role concentration can prevent independent review.
    mitigation: Keep L3/L4 changes blocked until a qualified independent reviewer is recorded.
    due: ongoing
    escalation: Any L3/L4 or Mission-Critical change enters G3 or G5.
    close_evidence: Named reviewer and completed independent review evidence.
  - id: AM-DEP-001
    type: dependency
    status: blocked-external
    severity: high
    probability: high
    impact: high
    impact_scope: formal-apple-distribution
    owner: "@AreaSong"
    summary: Formal Apple distribution requires external signing and notarization capability.
    mitigation: Keep formal distribution residuals open and do not relabel previews as releases.
    due: before-formal-distribution
    escalation: G6 formal distribution review.
    close_evidence: Developer ID, notarization, stapling, spctl, checksum and clean-Mac evidence.
  - id: AM-DEP-002
    type: dependency
    status: blocked-external
    severity: medium
    probability: high
    impact: medium
    impact_scope: trusted-preview-participation-and-feedback-operations
    owner: "@AreaSong"
    summary: Trusted preview participant invitation and feedback operations require external participants.
    mitigation: Keep the related v1 feedback residual open until real invitation and triage evidence exists.
    due: before-formal-test-distribution
    escalation: G6 trusted preview distribution decision.
    close_evidence: Tester roster, invitation, feedback route and triage owner evidence.
  - id: AM-DEP-003
    type: dependency
    status: deferred
    severity: high
    probability: high
    impact: high
    impact_scope: v2-promotion-and-live-execution
    owner: "@AreaSong"
    summary: AreaFlow execution cutover and live mapping are not authorized.
    mitigation: Permit governance authoring only; block promotion apply, execution and task-loop writes.
    due: before-v2-live-execution
    escalation: Any request to write execution state or start runner commands.
    close_evidence: Explicit execution authorization, live mapping, recovery plan and passing boundary tests.
  - id: AM-DEP-004
    type: dependency
    status: deferred
    severity: medium
    probability: high
    impact: medium
    impact_scope: remote-ci-and-branch-protection
    owner: "@AreaSong"
    summary: GitHub remote CI and branch protection are external merge controls.
    mitigation: Run local equivalent gates and require remote CI before merge.
    due: before-merge
    escalation: G5 merge readiness review.
    close_evidence: Required GitHub checks and branch protection evidence.

exceptions: []

capabilities:
  - id: AM-CAP-GOVERNANCE
    owner: "@AreaSong"
    status: active
    success_metrics:
      - ASW applicability matrix has no unclassified domain.
      - G0-G8 have unique AreaMatrix landing points.
      - Governance checks reject missing owners and widened execution permissions.
    operational_targets:
      - Quarterly source verification.
      - Governance CI on every PR and main push.
    retirement_conditions:
      - A superseding governance baseline is accepted and migration evidence is recorded.
