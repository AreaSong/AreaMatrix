title = "AreaMatrix gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Tracked fixtures and docs that intentionally contain benign examples"
paths = [
  '''.codex/runtime/task-loop/progress-backups/progress-before-reset-example.json''',
  '''.codex/task-loop-progress-backups/progress-before-reset-example.json''',
  '''apps/macos/AreaMatrixTests/AreaMatrixShellValidatePathTests.swift''',
]

[[rules]]
id = "areamatrix-local-path-leak"
description = "Detect committed macOS home directory paths"
regex = '''/Users/[A-Za-z0-9._-]+/'''
tags = ["path-leak"]

[rules.allowlist]
description = "Allow audited fixtures and the historical governance commit whose local path is removed by the current change"
commits = [
  '''197edde093f7724e20f90f295a17705224aa93e1''',
]
paths = [
  '''.codex/runtime/task-loop/progress-backups/progress-before-reset-example.json''',
  '''.codex/task-loop-progress-backups/progress-before-reset-example.json''',
]
