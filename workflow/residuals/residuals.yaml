  - id: global-ai-classification-call-log-gate
    status: deferred
    type: product-contract-gap
    title: suggest_category_with_ai remote path lacks pre-call log gate required by Core API
    source: docs/api/core-api.md
    supporting_sources:
      - core/src/ai_classification_suggestion/implementation.rs
      - core/src/ai_summary/implementation/generation.rs
      - core/src/ai_tags_suggestion/implementation.rs
    owner: core-storage
    current_impact: remote classification may execute before call-log gate; if insert_call_log later fails, remote data was already sent and Internal is returned after the fact. Summary and tags already have ensure_*_call_log_gate before remote execution.
    executable_task: true
    promotion_required: true
    close_condition: Add a pre-remote call-log gate to suggest_category_with_ai matching summary/tags, with privacy and failure-recovery tests proving no remote send when the gate fails.
    notes: High-risk privacy boundary; code change deferred pending explicit confirmation. Core API contract already requires the gate.
