    owner: core-storage
    current_impact: soft-deleted rows are retained indefinitely; no retention or cleanup job exists
    executable_task: true
    promotion_required: true
    close_condition: Either implement the documented retention cleanup for soft-deleted rows with file-safety tests, or amend ADR-0003/ADR-0006 to remove the 30-day retention promise.
    notes: Soft delete itself is implemented (status='deleted' plus deleted_at); only the retention/cleanup policy promised by the ADRs is missing.
