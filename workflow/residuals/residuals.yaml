  - id: global-product-metadata-reader-write-flags
    status: closed
    type: file-safety-gap
    title: Read-only repository metadata reader no longer has writable fallback
    source: apps/macos/AreaMatrix/Bridge/CoreBridgeUnavailableState.swift
    supporting_sources:
      - docs/architecture/macos-frontend-architecture.md
      - docs/api/core-api.md
    owner: macos-bridge
    current_impact: none
    executable_task: false
    promotion_required: false
    close_condition: Completed. The reader uses SQLITE_OPEN_READONLY for live WAL databases and an immutable read-only URI for clean databases without sidecars; missing and corrupt databases fail without creating files or modifying index.db or its WAL.
    validation:
      - macOS metadata reader unit and integration tests
      - xcodebuild macOS build and test
      - file-safety acceptance evidence showing no DB creation or mutation on reads
    notes: Closed after read-only open-mode and negative-path verification. Existing SQLite shared-memory lock coordination may update index.db-shm during a read-only WAL read; the reader does not create sidecars or modify index.db or index.db-wal.
