id: v2-experience-scope-middle-layer
version: v2
feature_id: v2-experience-scope
module: roadmap
status: ready
docs_refs:
  - file: docs/README.md
    line_start: 9
    line_end: 13
    heading: 文档层级
    excerpt: "`docs/` 只保存长期源事实"
  - file: docs/roadmap/milestones.md
    line_start: 81
    line_end: 128
    heading: Stage 2：体验完善
    excerpt: 把 MVP 打磨到"日常用 30 天不出大问题"
insertions:
  - target: v2 initial planning scope
    reason: Convert the formal Stage 2 roadmap into the first real v2 planning ledger.
    before: v2 was a placeholder blocked at discussion.
    after: v2 can create reviewed changes and plans without entering live execution.
links:
  - feature: v2-future-feature-slices
    relationship: parent-scope-for
    reason: Later Stage 2 features should split from this approved scope ledger.
code_impacts:
  existing:
    - docs/README.md
    - docs/roadmap/milestones.md
  expected:
    - workflow/versions/v2/changes/v2-experience-scope.yaml
    - workflow/versions/v2/plans/v2-experience-scope.plan.md
  tests:
    - scripts/dev_tools/discussion.py
    - scripts/dev_tools/middle_layer.py
    - scripts/dev_tools/workflow.py
dependencies:
  features: []
  docs:
    - docs/README.md
    - docs/roadmap/milestones.md
  code: []
  tasks: []
slice_plan:
  - id: docs-scope-ledger
    purpose: Record the approved Stage 2 roadmap scope before feature implementation planning.
    inputs:
      - docs/README.md
      - docs/roadmap/milestones.md
      - workflow/versions/v2/discussion/decisions.yaml
    outputs:
      - workflow/versions/v2/changes/v2-experience-scope.yaml
      - workflow/versions/v2/plans/v2-experience-scope.plan.md
    acceptance:
      - ./dev workflow discuss --version v2 doctor
      - ./dev workflow middle --version v2 doctor
      - ./dev workflow doctor
risk_boundaries:
  - Do not write workflow/versions/v2/execution from middle-layer planning.
  - Do not treat archived v1-mvp source docs as current v2 requirements.
  - Do not close v1 formal release blockers in v2 planning.
  - Do not generate drafts, queue candidates, or promotion preview before their gates pass.
