insertions:
  - target: Runtime observability and user support diagnostics
    reason: Unknown failures need a privacy-safe causal record shared by users, testers, support, and developers.
    before: Runtime evidence was fragmented across transactional logs, page errors, repository snapshots, and incomplete platform logging paths.
    after: The implemented versioned event contract connects semantic actions, Bridge calls, Core spans, storage outcomes, incidents, the independent Diagnostics UI, and portable diagnostics; fresh completion evidence remains pending.
links:
  - feature: v3-bilingual-architecture
    relationship: consumes-operation-identity-and-localized-presentation
    reason: Observability links to the existing operation identity contract and resolves user presentation without persisting translated sentences.
  - feature: v4-observability-diagnostics
    relationship: preserves-file-safety
    reason: Observation does not change import, staging, recovery, watcher, iCloud, DB, overview, or user-file mutation semantics.
