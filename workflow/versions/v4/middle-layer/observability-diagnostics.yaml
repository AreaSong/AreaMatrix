slice_plan:
  - id: product-and-security-contract
    purpose: Align product, privacy, UX, architecture, API, threat, retention, and compatibility contracts.
    inputs:
      - approved v4 discussion decisions
    outputs:
      - synchronized Exact Docs
      - structured event, mode, privacy, storage, package, and remote-boundary contracts
    acceptance:
      - ./dev check docs
      - ./dev check wording
      - ./dev workflow discuss --version v4 doctor
  - id: core-and-platform-foundation
    purpose: Implement the Rust subscriber and macOS observability hub without blocking business work.
    inputs:
      - approved event and privacy contract
    outputs:
      - bounded Core event sink
      - OSLog, ring buffer, rolling JSONL, health, retention, and signpost sinks
      - generated bindings and hand-written Bridge ownership
    acceptance:
      - cargo test --all-features --workspace
      - ./dev bindings verify
      - ./dev test macos
  - id: causal-import-and-user-experience
    purpose: Prove the complete causal model on import and expose audience-specific diagnostics.
    inputs:
      - working Core and platform foundation
    outputs:
      - end-to-end import trace
      - activity/problem center, incident capture, developer console, catalogs, and trace comparison
    acceptance:
      - import file-safety acceptance tests
      - macOS observability and diagnostics feature tests
      - en and zh-Hans UI evidence
  - id: portable-diagnostics
    purpose: Generate, preview, validate, and open privacy-preserving untrusted diagnostic packages.
    inputs:
      - stable event schema and local stores
    outputs:
      - .amdiagnostic exporter, manifest, checksums, privacy report, bounded parser, and offline viewer
    acceptance:
      - hostile package and redaction tests
      - no automatic network activity
      - preview and exported-content parity
  - id: completion-and-governance
    purpose: Prove failure isolation, performance, privacy, compatibility, documentation, and review readiness.
    inputs:
      - implemented product behavior with synchronized Exact Docs
    outputs:
      - fresh full validation evidence and documented residual risk
    acceptance:
      - ./dev check governance
      - ./dev check quality
      - ./dev workflow doctor
risk_boundaries:
  - Do not write workflow/versions/v4/execution or historical v1 execution artifacts from planning.
  - Do not read or record user-file bodies, note bodies, secrets, tokens, or complete AI payloads.
  - Do not mutate user files, import transactions, metadata, watcher state, iCloud state, or generated output while observing them.
  - Keep network upload disabled until separately approved service and security contracts exist.
  - Use fixture and temporary repositories for automated and UI evidence.
